
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Guía del Digitador</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tema-global.css?v=1">
  <script defer src="tema-global.js?v=1"></script>
</head>
<body>

  <form id="formLogin">
    <h1>GUÍA DEL DIGITADOR (BETA 1)</h1>
    <h2>Ingreso al Sistema</h2>

    <input
      type="text"
      id="usuario"
      placeholder="USUARIO"
      autocomplete="username"
      required>

    <input
      type="password"
      id="clave"
      placeholder="CONTRASEÑA"
      autocomplete="current-password"
      required>

    <button type="submit">Entrar</button>

    <p id="mensajeError" aria-live="polite"></p>
  </form>

  <footer>
    <div class="desarrollado-by">
      Desarrollado by: Ivan Frutos
    </div>
  </footer>

  <script src="login.js"></script>
</body>
</html>
