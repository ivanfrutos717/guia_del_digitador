<!DOCTYPE html> <!-- Declaración del estándar HTML5 -->
<html lang="es"> <!-- Idioma configurado en español -->
<head>
    <meta charset="UTF-8"> <!-- Codificación de caracteres universales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Diseño adaptable -->
    <title>Iniciar Sesión - Guía del Digitador</title> <!-- Título del navegador -->
    <link rel="stylesheet" href="style.css"> <!-- Vinculación con el CSS global -->
</head>
<body>

    <!-- Formulario principal de inicio de sesión -->
    <form id="formLogin">
        <h1>GUIA DEL DIGITADOR (BETA 1)</h1>
        <h2>Ingreso al Sistema</h2>

        <input type="text" id="usuario" placeholder="USUARIO" required>
        <input type="password" id="clave" placeholder="CONTRASEÑA" required>

        <button type="submit">Entrar</button>
        <p id="mensajeError"></p>
    </form>

    <!-- Pie de página con créditos de desarrollo y personalización -->
    <footer>
        <div class="desarrollado-by">Desarrollado by: Ivan Frutos</div>
        
        <!-- Panel para selección de color en tiempo real -->
        <div class="panel-colores">
            <div class="control-color">
                <label for="pickerFondo">Fondo:</label>
                <input type="color" id="pickerFondo" value="#0b0b0d">
            </div>
            <div class="control-color">
                <label for="pickerPrincipal">Acento:</label>
                <input type="color" id="pickerPrincipal" value="#dc2626">
            </div>
        </div>
    </footer>

    <!-- Scripts necesarios -->
    <script src="temas.js"></script>
    <script src="login.js"></script>
</body>
</html>
