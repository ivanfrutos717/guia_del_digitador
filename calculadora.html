
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora de Vencimientos - Guía del Digitador</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tema-global.css?v=1">
  <script defer src="tema-global.js?v=1"></script>
</head>
<body>

  <div class="card">

    <h1>GUÍA DEL DIGITADOR (BETA 1)</h1>

    <h2>Vencimiento de Factura</h2>

    <label for="fechaEmision">
      FECHA DE EMISIÓN:
    </label>

    <input
      type="date"
      id="fechaEmision"
      required>

    <label for="diasPlazo">
      DÍAS DE PLAZO:
    </label>

    <input
      type="number"
      id="diasPlazo"
      placeholder="Ej: 31"
      min="1"
      required>

    <button
      id="btnCalcular"
      type="button">
      Calcular Vencimiento
    </button>

    <div class="resultado-box">
      <span>FECHA LÍMITE DE PAGO</span>

      <h3 id="fechaResultado">
        -- / --- / ----
      </h3>
    </div>

    <a
      href="menu.html"
      class="btn-salir"
      style="margin-top:20px;text-align:center;">
      Volver al Menú
    </a>

  </div>

  <footer>
    <div class="desarrollado-by">
      Desarrollado by: Ivan Frutos
    </div>
  </footer>

  <script src="calculadora.js"></script>

</body>
</html>
