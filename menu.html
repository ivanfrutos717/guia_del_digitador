<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Guía del Digitador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-container">
        <h1>GUÍA DEL DIGITADOR</h1>
        
        <!-- Saludo con estilo degradado -->
        <h2 id="saludoUsuario" class="saludo-degradado">
            ¡Bienvenido!
        </h2>

        <div class="menu-grid">
            <a href="calculadora.html" class="opcion-card">
                <h3>Calculadora de Vencimientos</h3>
                <p>Cálculo de fechas límite de pago para facturas.</p>
                <span class="estado activo">Disponible</span>
            </a>

            <div class="opcion-card deshabilitado">
                <h3>Próximamente</h3>
                <p>Nueva herramienta en desarrollo.</p>
                <span class="estado pendiente">En Construcción</span>
            </div>

            <div class="opcion-card deshabilitado">
                <h3>Próximamente</h3>
                <p>Nueva herramienta en desarrollo.</p>
                <span class="estado pendiente">En Construcción</span>
            </div>
        </div>

        <a href="index.html" class="btn-salir" id="btnCerrarSesion">Cerrar Sesión</a>
    </div>

    <footer>
        <div class="desarrollado-by">Desarrollado by: Ivan Frutos</div>
        
        <div class="panel-colores">
            <div class="control-color">
                <label for="pickerFondo">Fondo:</label>
                <input type="color" id="pickerFondo" value="#0b0b0d">
            </div>
            <div class="control-color">
                <label for="pickerPrincipal">Acento:</label>
                <input type="color" id="pickerPrincipal" value="#dc2626">
            </div>
        </div>
    </footer>

    <script src="temas.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const usuarioGuardado = localStorage.getItem('usuarioActivo');
            const saludoElemento = document.getElementById('saludoUsuario');

            if (usuarioGuardado) {
                const nombreFormateado = usuarioGuardado.charAt(0).toUpperCase() + usuarioGuardado.slice(1);
                saludoElemento.textContent = `¡Bienvenido, ${nombreFormateado}!`;
            }

            /* Mantiene el saludo visible 3 segundos y luego aplica la animación para desaparecer */
            setTimeout(function() {
                if (saludoElemento) {
                    saludoElemento.classList.add('saludo-oculto');
                    
                    /* Remueve el elemento del flujo visual completamente tras la transición de 1s */
                    setTimeout(function() {
                        saludoElemento.style.display = 'none';
                    }, 1000);
                }
            }, 3000); /* 3000 ms = 3 segundos visible */

            /* Manejo de cierre de sesión */
            const btnSalir = document.getElementById('btnCerrarSesion');
            if (btnSalir) {
                btnSalir.addEventListener('click', function() {
                    localStorage.removeItem('usuarioActivo');
                });
            }
        });
    </script>
</body>
</html>
